name: Refresh network sources

# Two of the allowed-domains lists change without anything in this repo
# changing: Anthropic adds domains to the cloud environment default list, which
# makes entries here redundant, and the Zig project adds community mirrors,
# which makes the list incomplete. The latter fails as an intermittent 503,
# because mise shuffles the mirror list and only some runs pick the new host.
#
# Polling them turns both into a pull request instead of a debugging session.

on:
  workflow_dispatch:
  schedule:
  - cron: "40 4 12 * *"
permissions: {}
concurrency: refresh-network-sources

jobs:
  refresh:
    name: Refresh network sources
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Refresh the generated allowed-domains files
      run: sh network/refresh-sources.sh
    - name: Show what changed
      run: git diff
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        body: |
          Upstream network sources changed.

          * Zig community mirrors: <https://ziglang.org/download/community-mirrors.txt>
          * Anthropic default allowed domains: <https://code.claude.com/docs/en/cloud-environments>

          A change to the generated list means the **Allowed domains** field of
          the cloud environment needs updating by hand — it can only be set
          through the web UI. See [network/README.md](network/README.md).
        branch: chore/refresh-network-sources
        commit-message: "chore: refresh generated allowed-domains lists"
        title: "chore: refresh generated allowed-domains lists"
