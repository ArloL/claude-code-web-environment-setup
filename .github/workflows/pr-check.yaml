name: PR check

on:
  push:
  pull_request:
    branches:
    - main
    types:
    - reopened
  schedule:
  - cron: "2 16 31 * *"
permissions: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJSON(github) }}
      run: echo "$GITHUB_CONTEXT"
    - name: Dump job context
      env:
        JOB_CONTEXT: ${{ toJSON(job) }}
      run: echo "$JOB_CONTEXT"
    - name: Dump steps context
      env:
        STEPS_CONTEXT: ${{ toJSON(steps) }}
      run: echo "$STEPS_CONTEXT"
    - name: Dump runner context
      env:
        RUNNER_CONTEXT: ${{ toJSON(runner) }}
      run: echo "$RUNNER_CONTEXT"
    - name: Dump strategy context
      env:
        STRATEGY_CONTEXT: ${{ toJSON(strategy) }}
      run: echo "$STRATEGY_CONTEXT"
    - name: Dump matrix context
      env:
        MATRIX_CONTEXT: ${{ toJSON(matrix) }}
      run: echo "$MATRIX_CONTEXT"
    - name: Dump environment variables
      run: set
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
      # The setup scripts refuse to run unless this is set, so that they cannot
      # be run by accident on a real machine. A throwaway runner is one of the
      # two places they are meant to run, so opt in explicitly. See
      # assert-environment.sh.
    - name: Run the setup scripts
      env:
        X_ENVIRONMENT_MINE: 1
      run: sh setup.sh
    - name: Make sure build did not change anything
      run: git diff --exit-code
      # --external-sources so the assert-environment.sh guard is followed and
      # checked too, rather than reported as an unresolved source.
    - name: Lint the shell scripts
      run: |
        shellcheck --version
        shellcheck --external-sources \
          assert-environment.sh setup.sh go.sh mise/setup.sh claude/setup.sh \
          claude/session-start.sh network/discover.sh \
          network/refresh-sources.sh network/self-test.sh
    - name: Check the allowed-domains list is current and non-redundant
      run: python3 network/build-allowed-domains.py --check
    - name: Check the host-discovery tooling works
      run: bash network/self-test.sh
  required-status-check:
    name: pr-check.required-status-check
    needs:
    - test
    # GitHub Actions skips this job when any of the dependents fail. And skips
    # are considered success in their weird logic. So we always run it and fail
    # ourselves if necessary
    if: always()
    runs-on: ubuntu-latest
    steps:
    - run: echo "Use this job as the required status check of this workflow"
    - name: Check that all jobs were successful
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        echo "$RESULTS" | jq --exit-status 'all(.result == "success")' || exit 1
